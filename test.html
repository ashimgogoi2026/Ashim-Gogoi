<!DOCTYPE html>
<html>
<head>
<style>
  .parent {
    width: 300px;
    height: 50px;
    background: green;
    overflow: hidden;
    display: flex;
    align-items: center;
    justify-content: flex-start;
  }
  .child {
    background: red;
    white-space: nowrap;
    position: relative;
    animation: bounce 2s linear infinite alternate;
  }
  @keyframes bounce {
    0% { left: 0%; transform: translateX(0%); }
    100% { left: 100%; transform: translateX(-100%); }
  }
</style>
</head>
<body>
  <div class="parent">
    <div class="child">Hello World Long Text This is quite long</div>
  </div>
</body>
</html>
